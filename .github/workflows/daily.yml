name: Daily LEGO price check

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit price history back

# A scheduled run and a hand-triggered one must not race for the push.
concurrency:
  group: lego-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs on the same Python the tool will run on. A 3.12-only
      # f-string once parsed fine on the dev machine (3.14) and crashed
      # here; this catches that class of break before it matters.
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Check prices
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Amazon CAPTCHAs GitHub's servers; Scrape.do fetches it instead.
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
          PYTHONPATH: src
        run: python -m legotracker.cli

      # always(): prices are fetched before the email is sent, so a
      # mail failure must not throw away the day's history.
      - name: Save today's prices
        if: always()
        run: |
          git config user.name "lego-tracker"
          git config user.email "noreply@github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "data: prices for $(date +%F)"
          # a local `make check` commit would otherwise make every
          # future scheduled push fail
          git pull --rebase --autostash
          git push
